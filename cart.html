<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตะกร้าและงบประมาณ | Canteen Guide</title>
  <meta name="description" content="ตะกร้าอาหาร ราคารวม พลังงานรวม และการตั้งงบประมาณค่าอาหารวันนี้">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/common.js" defer></script>
  <script src="js/cart.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">ข้ามไปยังเนื้อหาหลัก</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Canteen Guide</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav-list">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="menu.html">เมนูทั้งหมด</a></li>
          <li><a href="shops.html">ร้านอาหาร</a></li>
          <li><a href="review.html">รีวิว</a></li>
          <li><a href="cart.html" class="cart-link" aria-current="page" aria-label="ตะกร้า 0 รายการ">ตะกร้า <span id="cart-count" class="cart-count">0</span></a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main" tabindex="-1">

    <div class="container">
      <h1 class="page-title">ตะกร้าและงบประมาณ</h1>

      <section class="section panel" aria-labelledby="budget-title">
        <h2 id="budget-title">งบวันนี้</h2>
        <form id="budget-form" novalidate>
          <div class="field">
            <label for="budget">งบค่าอาหารวันนี้ (บาท)</label>
            <input type="number" id="budget" name="budget" min="1" max="5000" step="1" inputmode="numeric"
                   required aria-describedby="budget-hint budget-error">
            <p id="budget-hint" class="meta">กรอกจำนวนเต็ม 1–5,000 บาท</p>
            <p id="budget-error" class="field-error" role="alert"></p>
          </div>
          <div class="button-row">
            <button type="submit" class="btn btn-primary">บันทึกงบ</button>
            <button type="button" id="clear-budget" class="btn btn-secondary">ล้างงบ</button>
          </div>
        </form>
        <p id="budget-status" class="alert alert-info" role="status" aria-live="polite"></p>
      </section>

      <section class="section" aria-labelledby="cart-heading">
        <h2 id="cart-heading" tabindex="-1">รายการในตะกร้า</h2>
        <div id="cart-content"><p class="loading">กำลังโหลดข้อมูล…</p></div>
      </section>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>Canteen Guide · Smart Campus · SC17332 Mini Project กลุ่มที่ 2</p>
    </div>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
